```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
}

.game {
    width: 370px;
    padding: 30px;
    text-align: center;
    background: rgba(255,255,255,0.1);
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
}

h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

.subtitle {
    color: #bfc8d6;
    margin-bottom: 20px;
}

.status {
    font-size: 20px;
    margin-bottom: 20px;
    font-weight: bold;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 22px;
}

.cell {
    height: 95px;
    border: none;
    border-radius: 18px;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 50px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.cell:hover {
    background: rgba(255,255,255,0.25);
    transform: scale(1.04);
}

.cell.x {
    color: #00e5ff;
}

.cell.o {
    color: #ff5c8a;
}

.cell.win {
    background: #24c77a;
    color: white;
    animation: pulse 0.7s infinite alternate;
}

button.restart {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: white;
    color: #182848;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button.restart:hover {
    transform: translateY(-2px);
    background: #e9f0ff;
}

.score {
    display: flex;
    justify-content: space-around;
    margin-bottom: 20px;
    color: #dce5f2;
}

.score div {
    background: rgba(255,255,255,0.08);
    padding: 10px 20px;
    border-radius: 12px;
}

@keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
}
</style>
</head>

<body>

<div class="game">

    <h1>⭕ Tic Tac Toe ❌</h1>

    <p class="subtitle">Classic • Simple • Fun</p>

    <div class="score">
        <div>❌ <span id="xScore">0</span></div>
        <div>⭕ <span id="oScore">0</span></div>
    </div>

    <div class="status" id="status">Player X's Turn</div>

    <div class="board">
        <button class="cell" onclick="play(0)"></button>
        <button class="cell" onclick="play(1)"></button>
        <button class="cell" onclick="play(2)"></button>
        <button class="cell" onclick="play(3)"></button>
        <button class="cell" onclick="play(4)"></button>
        <button class="cell" onclick="play(5)"></button>
        <button class="cell" onclick="play(6)"></button>
        <button class="cell" onclick="play(7)"></button>
        <button class="cell" onclick="play(8)"></button>
    </div>

    <button class="restart" onclick="restart()">🔄 New Game</button>

</div>

<script>

let board = ["","","","","","","","",""];
let currentPlayer = "X";
let gameOver = false;

let xScore = 0;
let oScore = 0;

const cells = document.querySelectorAll(".cell");
const status = document.getElementById("status");

const winningPatterns = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];

function play(index) {

    if (board[index] !== "" || gameOver)
        return;

    board[index] = currentPlayer;

    cells[index].textContent = currentPlayer;
    cells[index].classList.add(currentPlayer.toLowerCase());

    checkWinner();
}

function checkWinner() {

    for (let pattern of winningPatterns) {

        let [a,b,c] = pattern;

        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[b] === board[c]
        ) {

            gameOver = true;

            cells[a].classList.add("win");
            cells[b].classList.add("win");
            cells[c].classList.add("win");

            status.textContent = "🎉 Player " + currentPlayer + " Wins!";

            if (currentPlayer === "X") {
                xScore++;
                document.getElementById("xScore").textContent = xScore;
            } else {
                oScore++;
                document.getElementById("oScore").textContent = oScore;
            }

            return;
        }
    }

    if (!board.includes("")) {
        gameOver = true;
        status.textContent = "🤝 It's a Draw!";
        return;
    }

    currentPlayer = currentPlayer === "X" ? "O" : "X";

    status.textContent = "Player " + currentPlayer + "'s Turn";
}

function restart() {

    board = ["","","","","","","","",""];
    currentPlayer = "X";
    gameOver = false;

    cells.forEach(cell => {
        cell.textContent = "";
        cell.classList.remove("x", "o", "win");
    });

    status.textContent = "Player X's Turn";
}

</script>

</body>
</html>
